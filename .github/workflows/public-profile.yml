name: Public profile artwork
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - assets/profile.json
      - assets/toolkit.json
      - assets/learning.json
      - assets/exploring.json
      - assets/icon-map.json
      - assets/brand-map.json
      - assets/icons/**
      - assets/logos/**
      - scripts/**
concurrency:
  group: public-profile-artwork
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools pillow
      - name: Refresh anonymous contribution calendar independently
        run: python scripts/public_calendar.py
      - name: Refresh public profile snapshot (keep cached snapshot if upstream is unavailable)
        continue-on-error: true
        run: python scripts/refresh_public_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/test_labels.py
      - run: python scripts/build_dashboard.py
      - run: python scripts/build_toolkit.py
      - run: python scripts/refresh_hero.py
      - run: python scripts/test_public_calendar.py
      - run: python scripts/build_readme.py
      - run: python scripts/build_static.py
      - name: Create or update artwork pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/public-profile-artwork
          delete-branch: true
          commit-message: 'Refresh public profile artwork'
          title: 'Refresh public profile artwork'
          body: 'Automated update of generated profile artwork and README assets.'
          add-paths: |
            assets/
            README.md
            docs/STATIC.md
