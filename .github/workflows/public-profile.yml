name: Public profile artwork
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: public-profile-artwork
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools
      - run: python scripts/refresh_public_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/build_dashboard.py
      - run: python scripts/build_readme.py
      - run: python scripts/build_static.py
      - name: Save public artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets README.md docs/STATIC.md
          git diff --cached --quiet || git commit -m 'Refresh public profile artwork'
          git push
