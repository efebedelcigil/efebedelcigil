name: Public profile artwork
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - assets/profile.json
      - assets/toolkit.json
      - assets/learning.json
      - assets/exploring.json
      - assets/icon-map.json
      - assets/brand-map.json
      - assets/icons/**
      - assets/logos/**
      - assets/components3d/**
      - scripts/**
concurrency:
  group: public-profile-artwork-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_PUBLISH_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools pillow
      - name: Refresh anonymous contribution calendar independently
        run: python scripts/public_calendar.py
      - name: Refresh complete public profile snapshot
        run: python scripts/refresh_public_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/test_labels.py
      - run: python scripts/test_public_activity.py
      - run: python scripts/build_dashboard.py
      - run: python scripts/build_toolkit.py
      - run: python scripts/refresh_hero.py
      - run: python scripts/test_public_calendar.py
      - run: python scripts/test_pcb_components.py
      - run: python scripts/build_adaptive.py
      - run: python scripts/build_halo_atlas.py
      - run: python scripts/build_readme.py
      - run: python scripts/build_static.py
      - run: python scripts/test_publish_public_assets.py
      - run: python scripts/test_readme_live.py
      - name: Verify unattended publication access
        if: github.ref == 'refs/heads/main'
        env:
          PUBLISH_TOKEN_CONFIGURED: ${{ secrets.PROFILE_PUBLISH_TOKEN != '' }}
        run: |
          if [ "$PUBLISH_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Configure the repo-scoped PROFILE_PUBLISH_TOKEN secret before unattended publication."
            exit 1
          fi
      - name: Publish generated profile without a pull request
        if: github.ref == 'refs/heads/main'
        run: python scripts/publish_public_assets.py
