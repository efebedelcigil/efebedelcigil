name: Public profile artwork
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools
      - run: python scripts/refresh_public_profile.py
      - run: python scripts/build_dashboard.py
      - name: Save public artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/public-profile.json assets/contribution-*.svg assets/profile-cards-*.svg assets/repo-*.svg
          git diff --cached --quiet || git commit -m 'Refresh public profile artwork'
          git push
