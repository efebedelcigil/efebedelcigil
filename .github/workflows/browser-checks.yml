name: Profile browser checks
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/profile-browser-qa.cjs
      - .github/workflows/browser-checks.yml
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/profile-browser-qa.cjs
        env:
          QA_STANDALONE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-browser-results
          path: browser-results/
          retention-days: 14
